name: Publish F-Droid repo

# Manual by default: publishing costs Pages bandwidth and republishes the
# index, so it should be a decision rather than a side effect of every push.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose APK assets to publish (blank = latest)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # deploy-pages requires the job to declare this environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Derived, never hardcoded. GitHub redirects github.com/<old-name> after a
      # rename, but Pages does NOT: the site moves to the new name and a baked-in
      # URL silently points at a 404. repo_url goes into the SIGNED index, so a
      # stale one is a repo clients cannot fetch from.
      - name: Derive the public URLs
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.event.repository.name }}"
          echo "REPO_URL=https://${OWNER,,}.github.io/${NAME}/repo" >> "$GITHUB_ENV"
          echo "REPO_HTML_URL=${{ github.server_url }}/${{ github.repository }}" >> "$GITHUB_ENV"
          echo "Publishing to https://${OWNER,,}.github.io/${NAME}/repo"

      # From pip, in a venv, pinned -- NOT the distro package. Ubuntu ships
      # fdroidserver 2.2.1, which uses androguard 3.x: its ARSC parser raises
      # "res1 must be zero!" on any resources.arsc produced by a current AAPT2,
      # so it cannot read the APKs this repository builds. That is what failed
      # the first publish. Reproduced locally on the published APK, where 2.4.5
      # (androguard 4.1.4) processes the same file cleanly. The pip route was
      # previously avoided because old fdroidserver pulled unmaintained deps
      # (clint/args) that fail to build on current Python; 2.4.x no longer does.
      #
      # Pinned rather than floating: this step signs an index, and an upgrade
      # changing how APKs are parsed should be a decision, not a surprise on
      # the next publish.
      - name: Install fdroidserver
        run: |
          python3 -m venv "$RUNNER_TEMP/fdvenv"
          "$RUNNER_TEMP/fdvenv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/fdvenv/bin/pip" install --quiet 'fdroidserver==2.4.5'
          echo "$RUNNER_TEMP/fdvenv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fdvenv/bin/fdroid" --version

      - name: Fetch APKs from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p fdroid/repo
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "Publishing APKs from release $TAG"
          gh release download "$TAG" --pattern '*.apk' --dir fdroid/repo
          ls -la fdroid/repo

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "FDROID_KEYSTORE_B64 is not set; see fdroid/README.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fdroid-keystore.p12"

      - name: Build and sign the index
        working-directory: fdroid
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/fdroid-keystore.p12
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          # REPO_URL and REPO_HTML_URL come from the derive step via GITHUB_ENV.
          # ANDROID_HOME is deliberately not set here: the runner already
          # exports it, and ${{ env.ANDROID_HOME }} would expand to empty.
        run: |
          # config.yml references these by name; expand them into a runtime copy
          # so no secret is ever written to a tracked file.
          test -n "$(ls repo/*.apk 2>/dev/null)" \
            || { echo "No APKs in fdroid/repo -- did the release have assets?" >&2; exit 1; }
          test -n "$REPO_URL" || { echo "REPO_URL is empty" >&2; exit 1; }
          envsubst < config.yml > config.runtime.yml
          mv config.runtime.yml config.yml
          chmod 600 config.yml   # fdroid warns if the config is world-readable
          fdroid update --create-metadata --verbose
          # Publish the fingerprint in the job log: users need it to add the
          # repo safely, and it is not secret.
          echo "--- repo fingerprint (SHA-256) ---"
          GOT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
                   -storepass "$KEYSTORE_PASS" 2>/dev/null \
                 | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "$GOT"
          # Fail loudly if the index was signed by a key other than the one
          # users are told to pin. A repo whose fingerprint does not match the
          # published one is a repo nobody can add safely.
          WANT="$(sed -n 's/.*fingerprint=\([0-9a-f]\{64\}\).*/\1/p' ../fdroid/README.md | head -1)"
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "FATAL: index signed with $GOT but the published fingerprint is $WANT" >&2
            exit 1
          fi
          # The landing page quotes it, so it must be the fingerprint actually
          # signed with, not a value copied by hand into the page.
          echo "REPO_FINGERPRINT=$GOT" >> "$GITHUB_ENV"

      # The Pages artifact IS the site root. Uploading fdroid/repo directly
      # served the index at .../<name>/ while repo_url -- baked into the SIGNED
      # index, and the URL users are told to add -- says .../<name>/repo. The
      # first publish 404d for exactly that reason. Stage a site directory so
      # the served layout matches the URL the index was signed with, instead of
      # re-signing the index to match an accidental layout.
      - name: Stage the site
        env:
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          mkdir -p site
          cp -r fdroid/repo site/repo
          # Copy the repo output ONLY. fdroid/ also holds config.yml, which
          # carries the keystore passwords once substituted; publishing it
          # would put them on the open web.
          test -f site/repo/entry.jar || { echo "staged site has no index" >&2; exit 1; }
          test -f site/repo/index-v1.jar || { echo "staged site has no v1 index" >&2; exit 1; }
          if [ -n "$KEYSTORE_PASS" ] && grep -rlF -- "$KEYSTORE_PASS" site >/dev/null 2>&1; then
            echo "FATAL: a staged file contains the keystore password" >&2
            exit 1
          fi
          # Landing page at the site root. fdroid generates its own index.html
          # inside repo/; leave it alone rather than overwriting it.
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8">
          <title>OpenCPN (unofficial) F-Droid repo</title>
          <style>body{font-family:system-ui;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.5}code{background:#eee;padding:.1rem .3rem;word-break:break-all}</style>
          <h1>OpenCPN — unofficial builds</h1>
          <p>Add this URL as a repository in F-Droid:</p>
          <p><code>${REPO_URL}</code></p>
          <p>Pin the fingerprint when you add it -- a repository URL added
          without one trusts whatever key answers it:</p>
          <p><code>${REPO_URL}?fingerprint=${REPO_FINGERPRINT}</code></p>
          <p>Unofficial builds from the public GPL sources, not endorsed by the
          OpenCPN project. Analytics removed; o-charts support omitted; signed
          with a personal key. Build scripts:
          <a href="${REPO_HTML_URL}">${REPO_HTML_URL}</a>.</p>
          HTML
          echo "Staged:"; ls site site/repo | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
